<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="270" viewBox="0 0 1160 270"><style>text{font-family:Inter,"Microsoft YaHei","PingFang SC",sans-serif;fill:#1f2937}.muted{fill:#64748b}.tick{font-size:12px}.small{font-size:14px}.title{font-size:22px;font-weight:700}.bold{font-weight:700}</style><rect width="1160" height="270" fill="#fff"/><text x="580" y="34" class="title" text-anchor="middle">Log-Mel Fbank 特征提取流程</text><rect x="25" y="78" width="135" height="106" rx="13" stroke="#93c5fd" fill="#eff6ff" stroke-width="1.5"/><text x="92.5" y="121" class="small bold" text-anchor="middle">PCM 音频</text><text x="92.5" y="151" class="tick muted" text-anchor="middle">16 kHz / mono</text><line x1="163" y1="132" x2="178" y2="132" stroke="#64748b" stroke-width="2" /><path d="M178 132 l-6 -4 v8z" fill="#64748b"/><rect x="180" y="78" width="135" height="106" rx="13" stroke="#93c5fd" fill="#eff6ff" stroke-width="1.5"/><text x="247.5" y="121" class="small bold" text-anchor="middle">分帧 + 加窗</text><text x="247.5" y="151" class="tick muted" text-anchor="middle">25 ms / 10 ms</text><line x1="318" y1="132" x2="333" y2="132" stroke="#64748b" stroke-width="2" /><path d="M333 132 l-6 -4 v8z" fill="#64748b"/><rect x="335" y="78" width="135" height="106" rx="13" stroke="#93c5fd" fill="#eff6ff" stroke-width="1.5"/><text x="402.5" y="121" class="small bold" text-anchor="middle">FFT</text><text x="402.5" y="151" class="tick muted" text-anchor="middle">复数频谱</text><line x1="473" y1="132" x2="488" y2="132" stroke="#64748b" stroke-width="2" /><path d="M488 132 l-6 -4 v8z" fill="#64748b"/><rect x="490" y="78" width="135" height="106" rx="13" stroke="#93c5fd" fill="#eff6ff" stroke-width="1.5"/><text x="557.5" y="121" class="small bold" text-anchor="middle">功率谱</text><text x="557.5" y="151" class="tick muted" text-anchor="middle">|FFT|²</text><line x1="628" y1="132" x2="643" y2="132" stroke="#64748b" stroke-width="2" /><path d="M643 132 l-6 -4 v8z" fill="#64748b"/><rect x="645" y="78" width="135" height="106" rx="13" stroke="#059669" fill="#d1fae5" stroke-width="1.5"/><text x="712.5" y="121" class="small bold" text-anchor="middle">Mel 滤波器组</text><text x="712.5" y="151" class="tick muted" text-anchor="middle">80 个频带</text><line x1="783" y1="132" x2="798" y2="132" stroke="#64748b" stroke-width="2" /><path d="M798 132 l-6 -4 v8z" fill="#64748b"/><rect x="800" y="78" width="135" height="106" rx="13" stroke="#93c5fd" fill="#eff6ff" stroke-width="1.5"/><text x="867.5" y="121" class="small bold" text-anchor="middle">Log</text><text x="867.5" y="151" class="tick muted" text-anchor="middle">压缩动态范围</text><line x1="938" y1="132" x2="953" y2="132" stroke="#64748b" stroke-width="2" /><path d="M953 132 l-6 -4 v8z" fill="#64748b"/><rect x="955" y="78" width="135" height="106" rx="13" stroke="#93c5fd" fill="#e0e7ff" stroke-width="1.5"/><text x="1022.5" y="121" class="small bold" text-anchor="middle">Fbank [T,80]</text><text x="1022.5" y="151" class="tick muted" text-anchor="middle">语音模型输入</text><text x="580" y="220" class="small muted" text-anchor="middle">时间由 T 个顺序帧表示；每帧输出 80 个 Mel 频带的对数能量。</text></svg>