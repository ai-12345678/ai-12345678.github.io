name: Deploy documentation site to GitHub Pages

on:
  push:
    branches:
      - main
  release:
    types: [published]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.pages-artifact.outputs.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          cache: pip

      - name: Install Markdown renderer
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Build site
        run: python hack/build-pages.py

      - name: Refresh public TLS baselines
        run: python hack/build-tls-baselines.py

      - name: Download and publish front-desktop-tools
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo '::error::Configure PRIVATE_REPO_TOKEN with read access to front-desktop-tools.'
            exit 1
          fi
          archive_dir=$(mktemp -d)
          trap 'rm -rf "$archive_dir"' EXIT
          repo=ai-12345678/front-desktop-tools
          # Publish the latest release; redeploy requested for FrontTools v0.2.2.
          tag=$(gh release view --repo "$repo" --json tagName --jq .tagName)
          echo "Publishing front-desktop-tools $tag"
          gh release download "$tag" --repo "$repo" --pattern dist.zip --output "$archive_dir/dist.zip"
          mkdir -p "$archive_dir/site"
          unzip -q "$archive_dir/dist.zip" -d "$archive_dir/site"
          test -f "$archive_dir/site/index.html"
          mkdir -p _site/front-desktop-tools
          rsync -a --delete "$archive_dir/site/" _site/front-desktop-tools/

      - name: Sync latest Chrome extension release
        env:
          GH_TOKEN: ${{ secrets.CHROME_EXTENSION_READ_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          repo=ai-12345678/chrome-middleman-checker
          archive_dir=$(mktemp -d)
          trap 'rm -rf "$archive_dir"' EXIT
          if tag=$(gh release view --repo "$repo" --json tagName --jq .tagName) &&
             gh release download "$tag" --repo "$repo" --pattern "chrome-middleman-checker-$tag.tar.gz" --output "$archive_dir/extension.tar.gz" &&
             tar -tzf "$archive_dir/extension.tar.gz" > "$archive_dir/members.txt" &&
             grep -Fxq "chrome-middleman-checker-$tag/manifest.json" "$archive_dir/members.txt"; then
            mv "$archive_dir/extension.tar.gz" _site/download/chrome-middleman-checker.tar.gz
            echo "Published Chrome extension $tag"
          else
            echo '::warning::Extension release unavailable. Check CHROME_EXTENSION_READ_TOKEN access to chrome-middleman-checker. Publishing the bundled version.'
          fi

      - name: Set Pages artifact name
        id: pages-artifact
        run: echo "name=github-pages-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
          name: ${{ steps.pages-artifact.outputs.name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
