name: Deploy documentation site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.pages-artifact.outputs.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          cache: pip

      - name: Install Markdown renderer
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Build site
        run: python hack/build-pages.py

      - name: Download and publish front-desktop-tools
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo '::error::Configure PRIVATE_REPO_TOKEN with read access to front-desktop-tools.'
            exit 1
          fi
          archive_dir=$(mktemp -d)
          trap 'rm -rf "$archive_dir"' EXIT
          repo=ai-12345678/front-desktop-tools
          # Publish the latest release; redeploy requested for FrontTools v0.2.2.
          tag=$(gh release view --repo "$repo" --json tagName --jq .tagName)
          echo "Publishing front-desktop-tools $tag"
          gh release download "$tag" --repo "$repo" --pattern dist.zip --output "$archive_dir/dist.zip"
          mkdir -p "$archive_dir/site"
          unzip -q "$archive_dir/dist.zip" -d "$archive_dir/site"
          test -f "$archive_dir/site/index.html"
          mkdir -p _site/front-desktop-tools
          rsync -a --delete "$archive_dir/site/" _site/front-desktop-tools/

      - name: Set Pages artifact name
        id: pages-artifact
        run: echo "name=github-pages-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
          name: ${{ steps.pages-artifact.outputs.name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
