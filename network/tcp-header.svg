<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 760" width="1480" height="760" role="img" aria-labelledby="title desc">
<title id="title">TCP Header 位范围与字节偏移</title>
<desc id="desc">每行 32 位。固定 TCP 头部为字节 0 到 19，最多 40 字节的可选项与填充位于字节 20 到 59。图中包含各字段的宽度和功能。</desc>
<rect width="1480" height="760" fill="#fff"/>
<style>text {font-family: -apple-system, BlinkMacSystemFont, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;fill:#20354a;} .small{font-size:20px;fill:#61758b;} .field{font-size:23px;font-weight:600;} .sub{font-size:19px;fill:#51667c;} .label{font-size:23px;} .edge{stroke:#83a1b8;stroke-width:2;} </style>
<text x="62" y="65" font-size="40" font-weight="700">TCP 头部结构与字段范围</text>
<text x="62" y="108" class="small">每行 32 bits = 4 Bytes · 固定头部 20 Bytes · 最大头部 60 Bytes</text>
<text x="100" y="153" class="small">字节偏移</text>
<line x1="230" y1="160" x2="230" y2="170" stroke="#799bb1" stroke-width="2"/>
<text x="230" y="150" text-anchor="middle" class="small">0</text>
<line x1="494" y1="160" x2="494" y2="170" stroke="#799bb1" stroke-width="2"/>
<text x="494" y="150" text-anchor="middle" class="small">8</text>
<line x1="758" y1="160" x2="758" y2="170" stroke="#799bb1" stroke-width="2"/>
<text x="758" y="150" text-anchor="middle" class="small">16</text>
<line x1="1022" y1="160" x2="1022" y2="170" stroke="#799bb1" stroke-width="2"/>
<text x="1022" y="150" text-anchor="middle" class="small">24</text>
<line x1="1253" y1="160" x2="1253" y2="170" stroke="#799bb1" stroke-width="2"/>
<text x="1253" y="150" text-anchor="middle" class="small">31</text>
<text x="1302" y="150" class="small">bit</text>
<text x="140" y="207" text-anchor="middle" class="label">0–3</text>
<text x="140" y="233" text-anchor="middle" class="small">4 Bytes</text>
<text x="140" y="285" text-anchor="middle" class="label">4–7</text>
<text x="140" y="311" text-anchor="middle" class="small">4 Bytes</text>
<text x="140" y="363" text-anchor="middle" class="label">8–11</text>
<text x="140" y="389" text-anchor="middle" class="small">4 Bytes</text>
<text x="140" y="441" text-anchor="middle" class="label">12–15</text>
<text x="140" y="467" text-anchor="middle" class="small">4 Bytes</text>
<text x="140" y="519" text-anchor="middle" class="label">16–19</text>
<text x="140" y="545" text-anchor="middle" class="small">4 Bytes</text>
<rect x="230" y="172" width="528" height="78" fill="#dcecff" class="edge"/>
<text x="494" y="205" text-anchor="middle" class="field">Source Port（16 bits）</text>
<text x="494" y="233" text-anchor="middle" class="sub">源端口</text>
<rect x="758" y="172" width="528" height="78" fill="#dcecff" class="edge"/>
<text x="1022" y="205" text-anchor="middle" class="field">Destination Port（16 bits）</text>
<text x="1022" y="233" text-anchor="middle" class="sub">目标端口</text>
<rect x="230" y="250" width="1056" height="78" fill="#dbf2e9" class="edge"/>
<text x="758" y="283" text-anchor="middle" class="field">Sequence Number（32 bits）</text>
<text x="758" y="311" text-anchor="middle" class="sub">序列号：数据排序 / 重传</text>
<rect x="230" y="328" width="1056" height="78" fill="#dbf2e9" class="edge"/>
<text x="758" y="361" text-anchor="middle" class="field">Acknowledgment Number（32 bits）</text>
<text x="758" y="389" text-anchor="middle" class="sub">确认号：下一个期望字节序号</text>
<rect x="230" y="406" width="132" height="78" fill="#ffdfd2" class="edge"/>
<text x="296" y="439" text-anchor="middle" class="field">HLEN</text>
<text x="296" y="467" text-anchor="middle" class="sub">4 bits</text>
<rect x="362" y="406" width="132" height="78" fill="#edf0f4" class="edge"/>
<text x="428" y="439" text-anchor="middle" class="field">保留位</text>
<text x="428" y="467" text-anchor="middle" class="sub">4 bits</text>
<rect x="494" y="406" width="264" height="78" fill="#ffedc8" class="edge"/>
<text x="626" y="439" text-anchor="middle" class="field">Flags</text>
<text x="626" y="467" text-anchor="middle" class="sub">8 bits</text>
<rect x="758" y="406" width="528" height="78" fill="#dcecff" class="edge"/>
<text x="1022" y="439" text-anchor="middle" class="field">Window Size（16 bits）</text>
<text x="1022" y="467" text-anchor="middle" class="sub">接收窗口</text>
<rect x="230" y="484" width="528" height="78" fill="#ebe4ff" class="edge"/>
<text x="494" y="517" text-anchor="middle" class="field">Checksum（16 bits）</text>
<text x="494" y="545" text-anchor="middle" class="sub">校验和</text>
<rect x="758" y="484" width="528" height="78" fill="#ebe4ff" class="edge"/>
<text x="1022" y="517" text-anchor="middle" class="field">Urgent Pointer（16 bits）</text>
<text x="1022" y="545" text-anchor="middle" class="sub">紧急指针</text>
<rect x="230" y="562" width="1056" height="90" rx="3" fill="#fff1cf" class="edge"/>
<text x="758" y="597" text-anchor="middle" class="field">Options + Padding（0–40 Bytes）</text>
<text x="758" y="629" text-anchor="middle" class="sub">MSS / Window Scale / SACK / Timestamp · 4 字节对齐</text>
<text x="140" y="595" text-anchor="middle" class="label">20–59*</text>
<text x="140" y="627" text-anchor="middle" class="small">最多 40B</text>
<path d="M1309 172h16v390h-16" fill="none" stroke="#477da4" stroke-width="3"/>
<text x="1334" y="352" class="small">固定头部</text>
<text x="1334" y="381" class="small">20 Bytes</text>
<path d="M1309 562h16v90h-16" fill="none" stroke="#a27c2e" stroke-width="3"/>
<text x="1334" y="595" class="small">可选</text>
<text x="1334" y="624" class="small">0–40B</text>
<text x="62" y="682" font-size="21" fill="#344b63">* 可选项最大 40 字节时，占用偏移 20–59；无选项时头部在字节 19 结束。</text>
<text x="62" y="716" font-size="21" fill="#344b63">现代 TCP：Data Offset 4 位 + Reserved 4 位 + Flags 8 位（CWR/ECE/URG/ACK/PSH/RST/SYN/FIN）。</text>
</svg>
