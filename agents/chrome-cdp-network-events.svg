<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
<title id="title">CDP Network 主要事件与 HTTP 请求生命周期</title><desc id="desc">请求开始、响应头到达、数据接收、成功或失败，以及获取响应体的时序。</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#172033}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.arrow{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1440" height="920" fill="#fff"/>
<text x="40" y="55" font-size="36" font-weight="700">CDP Network：主要事件与请求生命周期</text><text x="40" y="90" font-size="20" fill="#475569">Chrome Extension · chrome.debugger · HTTP / HTTPS · 按 sessionId + requestId 关联事件</text>
<rect x="32" y="115" width="1376" height="552" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="55" y="151" font-size="23" font-weight="700">浏览器 / CDP Network</text><text x="730" y="151" font-size="23" font-weight="700">HTTP 服务端</text>
<path d="M1160 168V643" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="55" y="174" width="630" height="70" rx="9" fill="#eff6ff" stroke="#2563eb"/><text x="73" y="201" font-size="21" font-weight="650" class="mono" style="fill:#2563eb">Network.requestWillBeSent</text><text x="73" y="227" font-size="18">请求开始：URL / Method / requestId</text><path class="arrow" d="M370 244V262"/><rect x="55" y="265" width="630" height="70" rx="9" fill="#fffbeb" stroke="#b45309"/><text x="73" y="292" font-size="21" font-weight="650" class="mono" style="fill:#b45309">Network.responseReceived</text><text x="73" y="318" font-size="18">收到响应头：Status / Headers / MIME</text><path class="arrow" d="M370 335V353"/><rect x="55" y="356" width="630" height="70" rx="9" fill="#f5f3ff" stroke="#7c3aed"/><text x="73" y="383" font-size="21" font-weight="650" class="mono" style="fill:#7c3aed">Network.dataReceived × N</text><text x="73" y="409" font-size="18">响应数据分块到达；默认仅提供长度</text><path class="arrow" d="M370 426V444"/><rect x="55" y="447" width="630" height="70" rx="9" fill="#f0fdf4" stroke="#15803d"/><text x="73" y="474" font-size="21" font-weight="650" class="mono" style="fill:#15803d">Network.loadingFinished</text><text x="73" y="500" font-size="18">单次请求加载成功结束</text><path class="arrow" d="M370 517V535"/><rect x="55" y="538" width="630" height="70" rx="9" fill="#ecfdf5" stroke="#047857"/><text x="73" y="565" font-size="21" font-weight="650" class="mono" style="fill:#047857">Network.getResponseBody</text><text x="73" y="591" font-size="18">命令：使用 requestId 读取已缓冲的 Body</text>
<path class="arrow" d="M685 209H1158"/><text x="780" y="198" font-size="17">GET /api/data</text>
<path class="arrow" d="M1158 300H688"/><text x="780" y="289" font-size="17">HTTP 200 OK + Response Header</text>
<path class="arrow" d="M1158 391H688"/><text x="780" y="380" font-size="17">Body：chunk 1 … chunk N</text>
<rect x="735" y="426" width="630" height="81" rx="9" fill="#fef2f2" stroke="#dc2626"/><text x="751" y="455" class="mono" font-size="21" style="fill:#b91c1c">Network.loadingFailed</text><text x="751" y="482" font-size="17">失败分支：取消、断网等；并非成功之后的事件</text>
<path d="M700 390V466H733" class="arrow" stroke-dasharray="5 5"/>
<rect x="735" y="523" width="630" height="119" rx="9" fill="#eef2ff" stroke="#818cf8"/><text x="751" y="550" font-size="19" font-weight="650">ExtraInfo（可选事件，顺序不固定）</text><text x="751" y="577" class="mono" font-size="17">Network.requestWillBeSentExtraInfo</text><text x="751" y="602" class="mono" font-size="17">Network.responseReceivedExtraInfo</text><text x="751" y="626" font-size="16">补充网络层 Header 等信息，可先于或晚于对应主事件。</text>
<text x="40" y="708" font-size="24" font-weight="700">获取 Header 和 Body：典型成功流程</text>
<rect x="40" y="730" width="320" height="92" rx="10" fill="#eff6ff" stroke="#bfdbfe"/><text x="56" y="760" font-size="19" font-weight="700">1 · Network.enable</text><text x="56" y="790" font-size="17">启用监听</text><path class="arrow" d="M360 776h22"/><rect x="384" y="730" width="320" height="92" rx="10" fill="#eff6ff" stroke="#bfdbfe"/><text x="400" y="760" font-size="19" font-weight="700">2 · responseReceived</text><text x="400" y="790" font-size="17">缓存响应头 / requestId</text><path class="arrow" d="M704 776h22"/><rect x="728" y="730" width="320" height="92" rx="10" fill="#eff6ff" stroke="#bfdbfe"/><text x="744" y="760" font-size="19" font-weight="700">3 · loadingFinished</text><text x="744" y="790" font-size="17">等待响应完成</text><path class="arrow" d="M1048 776h22"/><rect x="1072" y="730" width="320" height="92" rx="10" fill="#ecfdf5" stroke="#86efac"/><text x="1088" y="760" font-size="19" font-weight="700">4 · getResponseBody</text><text x="1088" y="790" font-size="17">读取 Body / base64Encoded</text>
<text x="40" y="857" font-size="18">大文件 / SSE：可尝试实验性 streamResourceContent；流式模式下 dataReceived 可携带实际数据。</text>
<text x="40" y="886" font-size="18">注意：206 仅对应单次 Range；缓存淘汰、目标范围及长期连接均可能限制 Body 获取。</text></svg>