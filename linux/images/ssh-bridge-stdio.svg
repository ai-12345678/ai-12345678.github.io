<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="975" viewBox="0 0 1200 975" role="img" aria-label="SSH Bridge 的 stdin stdout stderr 数据流：普通终端使用 PTY，VS Code Remote-SSH 一般通过 Pipe 与本地 ssh-bridge 通信，再由 SSH Session Channel 连接远端 Bridge。">
<title>SSH Bridge 标准输入输出原理</title>
<desc>两种场景对比：普通终端为 Terminal、PTY、ssh-bridge、ssh、远端 sshd；VS Code Remote-SSH 为扩展、Pipe、本地 Go Wrapper、ssh、sshd 和远端 Bridge。左向箭头表示 stdout stderr 返回，右向箭头表示 stdin 传入。</desc>
<defs>
<marker id="right" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#1677d2"/></marker>
<marker id="left" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9,0 L0,4.5 L9,9 Z" fill="#059669"/></marker>
</defs>
<rect width="1200" height="975" fill="#f8fafc"/>
<rect x="0" y="0" width="1200" height="82" fill="#17243b"/>
<text x="600" y="51" font-family="sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="white">SSH Bridge：标准输入 / 输出如何传递</text>
<g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','Microsoft YaHei',sans-serif">
<rect x="18" y="103" width="1164" height="339" rx="22" fill="#ebf6ff" stroke="#c7e4fb" stroke-width="1.6"/>
<text x="42" y="148" font-size="23" fill="#12395f" font-weight="750" text-anchor="start">① 普通终端场景：stdin/stdout 通常连接 PTY</text>
<text x="42" y="177" font-size="16" fill="#47647e" font-weight="400" text-anchor="start">用户输入先进入伪终端；Shell 启动 ssh-bridge，再由 ssh-bridge 启动真正的 ssh。</text>
<rect x="33" y="211" width="176" height="143" rx="15" fill="#ffffff" stroke="#a6cff4" stroke-width="1.6"/>
<text x="121" y="254" font-size="18" fill="#162943" font-weight="700" text-anchor="middle">终端模拟器</text>
<text x="121" y="286" font-size="15" fill="#41556a" font-weight="500" text-anchor="middle">Terminal</text>
<text x="121" y="321" font-size="14" fill="#516577" font-weight="500" text-anchor="middle">键盘 / 屏幕</text>
<rect x="245" y="211" width="178" height="143" rx="15" fill="#fff7e9" stroke="#e9c386" stroke-width="1.6"/>
<text x="334" y="254" font-size="18" fill="#162943" font-weight="700" text-anchor="middle">PTY 设备</text>
<text x="334" y="286" font-size="15" fill="#41556a" font-weight="500" text-anchor="middle">Master ↔ Slave</text>
<text x="334" y="321" font-size="14" fill="#516577" font-weight="500" text-anchor="middle">例：/dev/pts/3</text>
<rect x="460" y="211" width="178" height="143" rx="15" fill="#f0fff6" stroke="#99dec0" stroke-width="1.6"/>
<text x="549" y="254" font-size="18" fill="#162943" font-weight="700" text-anchor="middle">本地 ssh-bridge</text>
<text x="549" y="286" font-size="15" fill="#41556a" font-weight="500" text-anchor="middle">Go 命令代理</text>
<text x="549" y="321" font-size="14" fill="#516577" font-weight="500" text-anchor="middle">继承 FD 0/1/2</text>
<rect x="675" y="211" width="180" height="143" rx="15" fill="#fff0ef" stroke="#e6bab5" stroke-width="1.6"/>
<text x="765" y="254" font-size="18" fill="#162943" font-weight="700" text-anchor="middle">真正的 ssh</text>
<text x="765" y="286" font-size="15" fill="#41556a" font-weight="500" text-anchor="middle">/usr/bin/ssh</text>
<text x="765" y="321" font-size="14" fill="#516577" font-weight="500" text-anchor="middle">SSH Client</text>
<rect x="892" y="211" width="274" height="143" rx="15" fill="#f8f1ff" stroke="#ccb8ef" stroke-width="1.6"/>
<text x="1029" y="254" font-size="18" fill="#162943" font-weight="700" text-anchor="middle">远端 sshd / 程序</text>
<text x="1029" y="286" font-size="15" fill="#41556a" font-weight="500" text-anchor="middle">SSH Session Channel</text>
<text x="1029" y="321" font-size="14" fill="#516577" font-weight="500" text-anchor="middle">经 SSH 加密通信</text>
<path d="M 212 253 L 236 253" fill="none" stroke="#1677d2" stroke-width="3" marker-end="url(#right)" />
<path d="M 236 307 L 212 307" fill="none" stroke="#059669" stroke-width="3" marker-start="url(#left)" />
<path d="M 426 253 L 451 253" fill="none" stroke="#1677d2" stroke-width="3" marker-end="url(#right)" />
<path d="M 451 307 L 426 307" fill="none" stroke="#059669" stroke-width="3" marker-start="url(#left)" />
<path d="M 641 253 L 666 253" fill="none" stroke="#1677d2" stroke-width="3" marker-end="url(#right)" />
<path d="M 666 307 L 641 307" fill="none" stroke="#059669" stroke-width="3" marker-start="url(#left)" />
<path d="M 858 253 L 883 253" fill="none" stroke="#1677d2" stroke-width="3" marker-end="url(#right)" />
<path d="M 883 307 L 858 307" fill="none" stroke="#059669" stroke-width="3" marker-start="url(#left)" />
<text x="43" y="385" font-size="16" fill="#33475e" font-weight="500" text-anchor="start">→ 蓝色：输入 / 请求 (stdin)        ← 绿色：输出 / 响应 (stdout、stderr)</text>
<text x="43" y="418" font-size="15" fill="#526578" font-weight="400" text-anchor="start">关键点：Shell / ssh-bridge / ssh 可以继承同一个 PTY；PTY 是数据来源，不是 stdin/stdout 的定义。</text>
<rect x="18" y="461" width="1164" height="346" rx="22" fill="#fff8e8" stroke="#f3dfad" stroke-width="1.6"/>
<text x="42" y="504" font-size="23" fill="#654916" font-weight="750" text-anchor="start">② VS Code Remote-SSH 场景：通常通过 Pipe，不需要本地 TTY</text>
<text x="42" y="534" font-size="16" fill="#776447" font-weight="400" text-anchor="start">VS Code 扩展启动本地代理，再由代理创建 ssh 子进程；SSH 在远端用 Session Channel 转发字节流。</text>
<rect x="33" y="575" width="178" height="150" rx="15" fill="#fff" stroke="#c5cbd4" stroke-width="1.6"/>
<text x="122" y="620" font-size="18" fill="#172943" font-weight="700" text-anchor="middle">VS Code 扩展</text>
<text x="122" y="652" font-size="16" fill="#43566d" font-weight="500" text-anchor="middle">创建子进程</text>
<text x="122" y="689" font-size="14" fill="#5b6777" font-weight="500" text-anchor="middle">上层程序</text>
<rect x="245" y="575" width="182" height="150" rx="15" fill="#edfff1" stroke="#c5cbd4" stroke-width="1.6"/>
<text x="336" y="620" font-size="18" fill="#172943" font-weight="700" text-anchor="middle">本地 ssh-bridge</text>
<text x="336" y="652" font-size="16" fill="#43566d" font-weight="500" text-anchor="middle">改写 + 日志</text>
<text x="336" y="689" font-size="14" fill="#5b6777" font-weight="500" text-anchor="middle">Go Wrapper</text>
<rect x="461" y="575" width="180" height="150" rx="15" fill="#fff0ee" stroke="#c5cbd4" stroke-width="1.6"/>
<text x="551" y="620" font-size="18" fill="#172943" font-weight="700" text-anchor="middle">真实 ssh 进程</text>
<text x="551" y="652" font-size="16" fill="#43566d" font-weight="500" text-anchor="middle">os/exec</text>
<text x="551" y="689" font-size="14" fill="#5b6777" font-weight="500" text-anchor="middle">子进程</text>
<rect x="675" y="575" width="180" height="150" rx="15" fill="#eef4ff" stroke="#c5cbd4" stroke-width="1.6"/>
<text x="765" y="620" font-size="18" fill="#172943" font-weight="700" text-anchor="middle">远端 sshd</text>
<text x="765" y="652" font-size="16" fill="#43566d" font-weight="500" text-anchor="middle">SSH Session</text>
<text x="765" y="689" font-size="14" fill="#5b6777" font-weight="500" text-anchor="middle">不必分配 PTY</text>
<rect x="890" y="575" width="276" height="150" rx="15" fill="#f7f0ff" stroke="#c5cbd4" stroke-width="1.6"/>
<text x="1028" y="620" font-size="18" fill="#172943" font-weight="700" text-anchor="middle">远端 Bridge / 服务</text>
<text x="1028" y="652" font-size="16" fill="#43566d" font-weight="500" text-anchor="middle">stdin ↔ stdout</text>
<text x="1028" y="689" font-size="14" fill="#5b6777" font-weight="500" text-anchor="middle">业务协议 / Unix Socket</text>
<path d="M 214 616 L 236 616" fill="none" stroke="#1677d2" stroke-width="3" marker-end="url(#right)" />
<path d="M 236 680 L 214 680" fill="none" stroke="#059669" stroke-width="3" marker-start="url(#left)" />
<path d="M 430 616 L 452 616" fill="none" stroke="#1677d2" stroke-width="3" marker-end="url(#right)" />
<path d="M 452 680 L 430 680" fill="none" stroke="#059669" stroke-width="3" marker-start="url(#left)" />
<path d="M 644 616 L 666 616" fill="none" stroke="#1677d2" stroke-width="3" marker-end="url(#right)" />
<path d="M 666 680 L 644 680" fill="none" stroke="#059669" stroke-width="3" marker-start="url(#left)" />
<path d="M 858 616 L 881 616" fill="none" stroke="#1677d2" stroke-width="3" marker-end="url(#right)" />
<path d="M 881 680 L 858 680" fill="none" stroke="#059669" stroke-width="3" marker-start="url(#left)" />
<text x="44" y="760" font-size="15" fill="#624f32" font-weight="500" text-anchor="start">VS Code ↔ ssh-bridge：Pipe    |    ssh-bridge ↔ ssh：通常由 os/exec 创建 Pipe    |    ssh ↔ sshd：SSH 加密通道</text>
<text x="44" y="786" font-size="14" fill="#776447" font-weight="400" text-anchor="start">说明：-T 禁止的是远端 PTY 分配，并不决定本地是否使用 Pipe / PTY。</text>
<rect x="18" y="829" width="1164" height="125" rx="18" fill="#ffffff" stroke="#d7e0e9" stroke-width="1.6"/>
<text x="44" y="861" font-size="20" fill="#173555" font-weight="700" text-anchor="start">核心概念</text>
<text x="44" y="891" font-size="17" fill="#273c52" font-weight="600" text-anchor="start">FD 0 = stdin（输入）    FD 1 = stdout（正常输出）    FD 2 = stderr（错误输出）</text>
<text x="44" y="922" font-size="16" fill="#4a6177" font-weight="400" text-anchor="start">这些文件描述符可以接到 PTY、Pipe、文件或 Socket；ssh-bridge 在子进程之间负责传递与处理数据。</text>
</g></svg>